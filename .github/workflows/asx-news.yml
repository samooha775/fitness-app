name: ASX news bot

on:
  schedule:
    # Every 15 min, weekdays, ~7am-8pm Sydney time (cron is UTC).
    - cron: "*/15 20-23 * * 0-4"   # Sun-Thu UTC evening = Mon-Fri morning in Australia
    - cron: "*/15 0-9 * * 1-5"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Only send a test message (checks token + chat id)"
        type: boolean
        default: false

concurrency:
  group: asx-news-bot
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ASX_TICKERS: ${{ secrets.ASX_TICKERS }}
      STATE_FILE: ${{ github.workspace }}/asx-news-bot/seen.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test message
        if: ${{ inputs.test_message }}
        run: python asx-news-bot/asx_news_bot.py --test

      # Remember which items were already sent between runs.
      - name: Restore sent-items list
        if: ${{ !inputs.test_message }}
        uses: actions/cache/restore@v4
        with:
          path: asx-news-bot/seen.json
          key: asx-news-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: asx-news-seen-

      - name: Check for news and send to Telegram
        if: ${{ !inputs.test_message }}
        run: python asx-news-bot/asx_news_bot.py

      - name: Save sent-items list
        if: ${{ always() && !inputs.test_message && hashFiles('asx-news-bot/seen.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: asx-news-bot/seen.json
          key: asx-news-seen-${{ github.run_id }}-${{ github.run_attempt }}
